<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>競艇収支管理</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
:root{--bg:#f5f7fb;--card:#fff;--text:#172033;--muted:#718096;--line:#e8edf5;--accent:#2563eb;--green:#10b981;--red:#ef4444}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif}
.app{max-width:760px;margin:auto;padding-bottom:90px}.header{padding:22px 18px 10px}.header h1{font-size:24px;margin:0 0 5px}.header p{margin:0;color:var(--muted);font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;padding:10px 16px}.card{background:var(--card);border-radius:18px;padding:16px;box-shadow:0 3px 14px #1e293b0d}.label{font-size:12px;color:var(--muted)}.value{font-size:25px;font-weight:800;margin-top:7px}.sub{font-size:12px;color:var(--muted);margin-top:4px}.profit{color:var(--green)}.loss{color:var(--red)}
.section{padding:10px 16px}.section h2{font-size:17px;margin:8px 2px 12px}.chart-card{height:280px}.chart-card canvas{width:100%!important;height:220px!important}
.btn{border:0;border-radius:14px;padding:13px 16px;font-weight:700;font-size:14px;cursor:pointer}.primary{background:var(--accent);color:white}.secondary{background:#eef3ff;color:var(--accent)}.danger{background:#fff0f0;color:var(--red)}
.form{display:grid;gap:11px}.form label{font-size:12px;color:var(--muted);font-weight:700}.form input,.form select{width:100%;padding:13px;border:1px solid var(--line);border-radius:12px;font-size:16px;background:#fff}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px;align-items:flex-end}.modal.show{display:flex}.sheet{background:#fff;border-radius:22px 22px 0 0;padding:20px;width:100%;max-width:760px;margin:auto;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.actions{display:flex;gap:8px;margin-top:8px}
.history{display:grid;gap:9px}.item{background:#fff;border-radius:15px;padding:13px 14px;display:flex;justify-content:space-between;gap:10px;align-items:center}.item strong{font-size:14px}.item small{display:block;color:var(--muted);margin-top:4px}.item-right{text-align:right}.empty{text-align:center;color:var(--muted);padding:25px}
.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);padding:10px max(16px,calc((100vw - 760px)/2 + 16px));display:flex;gap:8px;z-index:10}.bottom button{flex:1}
@media(min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}.grid{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<div class="app">
<header class="header">
<h1>🚤 競艇収支管理</h1>
<p id="today"></p>
</header>

<div class="grid">
  <div class="card"><div class="label">今日の収支</div><div id="dayProfit" class="value">¥0</div><div id="dayRate" class="sub">回収率 0%</div></div>
  <div class="card"><div class="label">今週の収支</div><div id="weekProfit" class="value">¥0</div><div id="weekRate" class="sub">回収率 0%</div></div>
  <div class="card"><div class="label">今月の収支</div><div id="monthProfit" class="value">¥0</div><div id="monthRate" class="sub">回収率 0%</div></div>
  <div class="card"><div class="label">今年の収支</div><div id="yearProfit" class="value">¥0</div><div id="yearRate" class="sub">回収率 0%</div></div>
</div>

<div class="section"><button class="btn primary" style="width:100%" onclick="openModal()">＋ 収支を記録する</button></div>

<div class="section">
<h2>📈 累計収支</h2>
<div class="card chart-card"><canvas id="profitChart"></canvas></div>
</div>
<div class="section">
<h2>📊 掛け金・払い戻し</h2>
<div class="card chart-card"><canvas id="betChart"></canvas></div>
</div>

<div class="section">
<h2>🧾 最近の記録</h2>
<div id="history" class="history"></div>
</div>
</div>

<div class="bottom">
<button class="btn secondary" onclick="openModal()">＋ 記録</button>
<button class="btn secondary" onclick="exportCSV()">CSV出力</button>
<button class="btn danger" onclick="clearAll()">全削除</button>
</div>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()">
<div class="sheet">
<h2>収支を記録</h2>
<form class="form" onsubmit="saveEntry(event)">
<label>日付<input id="date" type="date" required></label>
<label>競艇場<input id="place" type="text" placeholder="例：戸田"></label>
<label>レース番号<input id="race" type="number" min="1" max="12" placeholder="10"></label>
<label>掛け金（円）<input id="bet" type="number" min="0" step="100" required placeholder="1000"></label>
<label>払い戻し（円）<input id="payout" type="number" min="0" step="100" required placeholder="2400"></label>
<label>メモ<input id="memo" type="text" placeholder="買い目など"></label>
<div class="actions"><button type="button" class="btn secondary" style="flex:1" onclick="closeModal()">キャンセル</button><button class="btn primary" style="flex:1">保存</button></div>
</form>
</div>
</div>

<script>
const KEY="boatRaceEntriesV1";
let entries=JSON.parse(localStorage.getItem(KEY)||"[]");
let profitChart,betChart;

const yen=n=>"¥"+Math.round(n).toLocaleString("ja-JP");
const dateStr=d=>d.toISOString().slice(0,10);
function today(){const d=new Date();return dateStr(new Date(d.getTime()-d.getTimezoneOffset()*60000))}
function startOfWeek(d){const x=new Date(d); const day=x.getDay(); x.setDate(x.getDate()-(day===0?6:day-1)); x.setHours(0,0,0,0); return x}
function calc(filter){
 const a=entries.filter(e=>filter(new Date(e.date+"T00:00:00")));
 const bet=a.reduce((s,e)=>s+e.bet,0), payout=a.reduce((s,e)=>s+e.payout,0);
 return {bet,payout,profit:payout-bet,rate:bet?payout/bet*100:0};
}
function setCard(id, r){
 const el=document.getElementById(id+"Profit"), rate=document.getElementById(id+"Rate");
 el.textContent=yen(r.profit); el.className="value "+(r.profit>0?"profit":r.profit<0?"loss":"");
 rate.textContent="回収率 "+r.rate.toFixed(1)+"%";
}
function refresh(){
 const now=new Date(), td=today();
 document.getElementById("today").textContent=now.toLocaleDateString("ja-JP",{year:"numeric",month:"long",day:"numeric",weekday:"long"});
 setCard("day",calc(d=>dateStr(new Date(d.getTime()-d.getTimezoneOffset()*60000))===td));
 const ws=startOfWeek(now); setCard("week",calc(d=>d>=ws));
 const ms=new Date(now.getFullYear(),now.getMonth(),1); setCard("month",calc(d=>d>=ms));
 const ys=new Date(now.getFullYear(),0,1); setCard("year",calc(d=>d>=ys));
 renderHistory(); renderCharts();
}
function saveEntry(ev){
 ev.preventDefault();
 entries.push({id:Date.now(),date:date.value,place:place.value.trim(),race:race.value,bet:+bet.value,payout:+payout.value,memo:memo.value.trim()});
 entries.sort((a,b)=>b.id-a.id); localStorage.setItem(KEY,JSON.stringify(entries)); ev.target.reset(); date.value=today(); closeModal(); refresh();
}
function openModal(){modal.classList.add("show");date.value=today()}
function closeModal(){modal.classList.remove("show")}
function renderHistory(){
 const box=document.getElementById("history");
 if(!entries.length){box.innerHTML='<div class="empty">まだ記録がありません</div>';return}
 box.innerHTML=entries.slice(0,20).map(e=>{
  const p=e.payout-e.bet;
  return `<div class="item"><div><strong>${e.place||"競艇場未入力"} ${e.race?e.race+"R":""}</strong><small>${e.date}${e.memo?"　"+esc(e.memo):""}<br>投資 ${yen(e.bet)} → 払戻 ${yen(e.payout)}</small></div><div class="item-right"><strong class="${p>0?'profit':p<0?'loss':''}">${p>=0?"+":""}${yen(p)}</strong><br><button class="btn danger" style="padding:6px 9px;margin-top:5px" onclick="removeEntry(${e.id})">削除</button></div></div>`
 }).join("");
}
function esc(s){return s.replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function removeEntry(id){if(confirm("この記録を削除しますか？")){entries=entries.filter(e=>e.id!==id);localStorage.setItem(KEY,JSON.stringify(entries));refresh()}}
function renderCharts(){
 const sorted=[...entries].sort((a,b)=>a.date.localeCompare(b.date));
 let cum=0; const labels=[],profits=[],bets=[],payouts=[];
 sorted.forEach(e=>{cum+=e.payout-e.bet;labels.push(e.date.slice(5));profits.push(cum);bets.push(e.bet);payouts.push(e.payout)});
 if(profitChart)profitChart.destroy(); if(betChart)betChart.destroy();
 profitChart=new Chart(document.getElementById("profitChart"),{type:"line",data:{labels,datasets:[{label:"累計収支",data:profits,tension:.3,fill:false}]},options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}}}});
 betChart=new Chart(document.getElementById("betChart"),{type:"bar",data:{labels,datasets:[{label:"掛け金",data:bets},{label:"払い戻し",data:payouts}]},options:{responsive:true,maintainAspectRatio:false}});
}
function exportCSV(){
 const rows=[["日付","競艇場","レース","掛け金","払い戻し","収支","回収率","メモ"],...entries.map(e=>[e.date,e.place,e.race,e.bet,e.payout,e.payout-e.bet,e.bet?(e.payout/e.bet*100).toFixed(1):0,e.memo])];
 const csv="\ufeff"+rows.map(r=>r.map(v=>`"${String(v).replaceAll('"','""')}"`).join(",")).join("\n");
 const a=document.createElement("a");a.href=URL.createObjectURL(new Blob([csv],{type:"text/csv"}));a.download="競艇収支.csv";a.click();URL.revokeObjectURL(a.href);
}
function clearAll(){if(confirm("すべての記録を削除します。よろしいですか？")){entries=[];localStorage.removeItem(KEY);refresh()}}
refresh();
</script>
</body>
</html>
